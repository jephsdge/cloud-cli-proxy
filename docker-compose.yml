services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudproxy}
      POSTGRES_USER: ${POSTGRES_USER:-cloudproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or use external DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudproxy} -d ${POSTGRES_DB:-cloudproxy}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - cloudproxy-postgres:/var/lib/postgresql

  control-plane:
    image: ghcr.io/zanel1u/cloud-cli-proxy/control-plane:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cloudproxy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloudproxy}?sslmode=disable
      CONTROL_PLANE_ADDR: ":8080"
      HOST_AGENT_MODE: embedded
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in .env}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: ${CLOUD_CLI_PROXY_DATA_DIR:-${PWD}/runtime-data}
      CLOUD_CLI_PROXY_SKIP_IMAGE_PULL: ${CLOUD_CLI_PROXY_SKIP_IMAGE_PULL:-false}
      CLOUD_CLI_PROXY_GATEWAY_IMAGE: ghcr.io/zanel1u/cloud-cli-proxy/sing-box-gateway:latest
      CLOUD_CLI_PROXY_NETWORK_MTU: ${CLOUD_CLI_PROXY_NETWORK_MTU:-}
      CLOUD_CLI_PROXY_EGRESS_NETWORK_BASE: ${CLOUD_CLI_PROXY_EGRESS_NETWORK_BASE:-}
      CLOUD_CLI_PROXY_WORKER_USER: ${CLOUD_CLI_PROXY_WORKER_USER:-}
      CLOUD_CLI_PROXY_WORKER_UID: ${CLOUD_CLI_PROXY_WORKER_UID:-}
      CLOUD_CLI_PROXY_WORKER_GID: ${CLOUD_CLI_PROXY_WORKER_GID:-}
      CLOUD_CLI_PROXY_WORKER_HOME: ${CLOUD_CLI_PROXY_WORKER_HOME:-}
      SSH_PROXY_CONTAINER_USER: ${SSH_PROXY_CONTAINER_USER:-}
      SSH_PROXY_HOST_KEY_PATH: ${SSH_PROXY_HOST_KEY_PATH:-${CLOUD_CLI_PROXY_DATA_DIR:-${PWD}/runtime-data}/ssh-proxy/ssh_host_ed25519_key}
    ports:
      - "${SSH_PROXY_PORT:-2222}:2222"
    privileged: true
    pid: host
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLOUD_CLI_PROXY_DATA_DIR:-${PWD}/runtime-data}:${CLOUD_CLI_PROXY_DATA_DIR:-${PWD}/runtime-data}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  admin:
    image: ghcr.io/zanel1u/cloud-cli-proxy/admin:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-3000}:80"

  sing-box-gateway:
    image: ghcr.io/zanel1u/cloud-cli-proxy/sing-box-gateway:latest
    pull_policy: always
    restart: "no"
    command: ["true"]

  managed-user:
    image: ghcr.io/zanel1u/cloud-cli-proxy/managed-user:latest
    pull_policy: always
    restart: "no"
    command: ["true"]

  sing-box:
    image: ghcr.io/sagernet/sing-box:v1.13.11
    pull_policy: always
    restart: "no"
    command: ["true"]

volumes:
  cloudproxy-postgres:
